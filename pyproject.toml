[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscope"
version = "0.1.0"
description = "PhishScope + Sigma Detection Toolkit"
authors = [
    {name = "SOC Analyst"}
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.0.280"
]

[project.scripts]
phishscope = "phishscope.cli:main"

[tool.setuptools]
packages = ["phishscope"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
